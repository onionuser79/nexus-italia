gateway_id: NEXUS-ITALIA-[sigla provincia]
site_name: "NEXUS-ITALIA [provincia]"
region: [regione]
mesh_id: mesh-[provincia]
radio_band: "868"
channel_name: NEXUS
channel_number: 1
channel_scope: "it-lom-mi"
# default_scope: "it"  # optional — scope for device-level adverts; defaults to channel_scope if omitted
channel_secret: "a45768ab48e203498edbc11b35cdfbd7"  # 32-char hex = 16 bytes key
path_hash_mode: 1  # 0=1byte(256 IDs), 1=2byte(65536 IDs), 2=3byte(16M IDs)
protocol_version: "1.0"

meshcore:
  serial_port: /dev/ttyUSB0
  baudrate: 115200
  mode: serial

mqtt:
  host: mqtt.example.org
  port: 1883
  username: NEXUS-ITALIA-[sigla provincia]
  password: [password da richiedere a info@meshcoreitalia.it]
  keepalive: 30
  tls: false
  uplink_topic: nexus/v1/uplink
  downlink_topic: nexus/v1/downlink/NEXUS-ITALIA-[sigla provincia]
  heartbeat_topic: nexus/v1/heartbeat/NEXUS-ITALIA-[sigla provincia]
  status_topic: nexus/v1/status/NEXUS-ITALIA-[sigla provincia]

runtime:
  dedupe_ttl_sec: 180
  heartbeat_interval_sec: 30
  poll_interval_sec: 5
  log_level: INFO
  beacon_interval_sec: 10800
  beacon_channel: 2
  beacon_text: "NEXUS-ITALIA Gateway [sigla provincia] - meshcoreitalia.it"
  advert_enabled: true                     # advert 0hop
  advert_interval_sec: 3600                # ogni 1 ora
  flood_advert_enabled: true               # flood advert (channel scope)
  flood_advert_interval_sec: 10800         # ogni 3 ore
  default_scope_advert_enabled: true       # flood advert with default_scope (broader reach)
  default_scope_advert_interval_sec: 10800 # ogni 3 ore

  # --- Recovery / liveness (v2.2.0) ---
  # Il companion USB puo' ri-enumerarsi (brownout, watchdog reset): il vecchio
  # file descriptor resta morto e va riaperto. Questi parametri governano il
  # rilevamento e il recupero automatico.
  # Soglie ricavate dai gap RX misurati a Bollate su 7843 frame
  # (2026-07-05 -> 2026-08-23): mediana 121 s, p99 6098 s, max 24381 s (6,8 h).
  # Le pause notturne legittime durano ore: con 3600 s si otterrebbero 177
  # riconnessioni inutili (~3,6/giorno). 28800 s (8 h) = zero falsi positivi.
  # Il caso reale (companion USB staccato) viene comunque intercettato dal
  # health loop in ~90 s, non da questo watchdog.
  rx_watchdog_enabled: true                # riconnette se la radio non riceve piu'
  rx_watchdog_warn_sec: 7200               # 2 ore di silenzio RX -> WARNING
  rx_watchdog_reconnect_sec: 28800         # 8 ore di silenzio RX -> riconnessione
  companion_fail_threshold: 3              # letture uptime fallite prima del recupero
  reconnect_cooldown_sec: 300              # minimo fra due tentativi di recupero
